name: Full DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_USERNAME: ${{ github.actor }}

permissions:
  contents: read
  packages: write
  security-events: write  # ← TO JEST KLUCZOWE!
  actions: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    outputs:
      vulnerabilities_found: ${{ steps.check-vulns.outputs.vuln_count }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build image for scanning
      run: |
        docker build -t devsecops-nginx:scan ./applications/nginx
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      id: trivy-scan
      with:
        image-ref: 'devsecops-nginx:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4  # ← Zaktualizowane do v4!
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Check and count vulnerabilities
      id: check-vulns
      run: |
        if [ -f trivy-results.sarif ]; then
          # Simple count - we expect vulnerabilities in this demo
          VULN_COUNT=$(grep -o '"level":"error"' trivy-results.sarif | wc -l || echo "0")
          echo "Found $VULN_COUNT HIGH/CRITICAL vulnerabilities"
          echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "⚠️  Security vulnerabilities detected (EXPECTED for demo)"
          else
            echo "✅ No critical vulnerabilities found"
          fi
        else
          echo "vuln_count=0" >> $GITHUB_OUTPUT
          echo "❌ Scan failed or no report generated"
        fi
    
    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "## Scan Details" >> security-summary.md
        echo "- Date: $(date)" >> security-summary.md
        echo "- Image: devsecops-nginx:scan" >> security-summary.md
        echo "- Scanner: Trivy" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Educational Note" >> security-summary.md
        echo "This application contains INTENTIONAL vulnerabilities for educational purposes." >> security-summary.md
        echo "Expected findings: 35+ vulnerabilities in nginx:1.18.0-alpine" >> security-summary.md

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ secrets.GH_TOKEN }}
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./applications/nginx
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Verify pushed image
      run: |
        echo "✅ Image successfully pushed to GitHub Container Registry"
        echo ""
        echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "🔗 View at: https://github.com/${{ github.repository }}/pkgs/container/$(echo ${{ env.IMAGE_NAME }} | cut -d'/' -f2-)"

  test-deployment:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Start DevSecOps environment
      run: |
        echo "🚀 Starting DevSecOps environment..."
        
        # Simple test without Docker Compose (faster)
        echo "Testing basic Docker functionality..."
        
        # Test if we can run containers
        docker run --rm hello-world && echo "✅ Docker works"
        
        echo ""
        echo "Simulated deployment test - in full pipeline would:"
        echo "1. Start all services with docker-compose"
        echo "2. Test Nginx, Juice Shop, Grafana, Prometheus"
        echo "3. Run health checks"
        echo "4. Generate test reports"
        
        echo "✅ Deployment test simulation complete"
    
    - name: Generate simple test report
      run: |
        echo "# Test Deployment Report" > test-report.md
        echo "## Summary" >> test-report.md
        echo "- Docker: ✅ Functional" >> test-report.md
        echo "- Services: Would be tested in full deployment" >> test-report.md
        echo "- Environment: GitHub Actions Runner" >> test-report.md

  generate-final-report:
    needs: [security-scan, build-and-push, test-deployment]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Combine all reports
      run: |
        echo "# DevSecOps Pipeline - Complete Report" > final-report.md
        echo "## Summary" >> final-report.md
        echo "- Workflow: ${{ github.workflow }}" >> final-report.md
        echo "- Run ID: ${{ github.run_id }}" >> final-report.md
        echo "- Repository: ${{ github.repository }}" >> final-report.md
        echo "" >> final-report.md
        
        echo "## Results" >> final-report.md
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> final-report.md
        echo "- Build & Push: ${{ needs.build-and-push.result }}" >> final-report.md
        echo "- Test Deployment: ${{ needs.test-deployment.result }}" >> final-report.md
        echo "" >> final-report.md
        
        echo "## Links" >> final-report.md
        echo "- [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> final-report.md
        echo "- [Security Findings](https://github.com/${{ github.repository }}/security)" >> final-report.md
        echo "- [Container Registry](https://github.com/${{ github.repository }}/pkgs/container/$(echo ${{ github.repository }} | cut -d'/' -f2-))" >> final-report.md
        
        cat final-report.md
    
    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: devsecops-pipeline-artifacts
        path: |
          security-summary.md
          test-report.md
          final-report.md
        retention-days: 90

  send-notification:
    needs: generate-final-report
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Pipeline completion notification
      run: |
        echo "🎉 DevSecOps Pipeline Execution Complete!"
        echo ""
        echo "📊 Results Summary:"
        echo "-------------------"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Build & Push: ${{ needs.build-and-push.result }}"
        echo "Test Deployment: ${{ needs.test-deployment.result }}"
        echo ""
        echo "🔗 View details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
