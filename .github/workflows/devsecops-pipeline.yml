name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scans

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: devsecops-cluster

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:test ./applications/nginx
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.IMAGE_NAME }}:test'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Check for critical vulnerabilities
      run: |
        if grep -q '"severity": "CRITICAL"' trivy-results.sarif; then
          echo "❌ Critical vulnerabilities found! Build failed."
          exit 1
        else
          echo "✅ No critical vulnerabilities found."
        fi
    
    - name: Run Hadolint (Dockerfile linter)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./applications/nginx/Dockerfile
    
    - name: Run Checkov (Infrastructure as Code scanner)
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ./
        framework: kubernetes

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./applications/nginx
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
    
    - name: Sign container image
      uses: sigstore/cosign-installer@v3
      with:
        cosign-release: 'v2.1.1'
      continue-on-error: true

  kubernetes-deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up KIND cluster
      uses: engineerd/setup-kind@v0.6.0
      with:
        version: "v0.20.0"
    
    - name: Create KIND cluster
      run: |
        kind create cluster --name ${{ env.CLUSTER_NAME }} --config kind-config.yaml
        kind get kubeconfig --name ${{ env.CLUSTER_NAME }} > kubeconfig
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Deploy to KIND
      run: |
        export KUBECONFIG=kubeconfig
        
        # Load image into KIND
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --name ${{ env.CLUSTER_NAME }}
        
        # Apply Kubernetes manifests
        kubectl apply -f kubernetes/00-namespace.yaml
        kubectl apply -f kubernetes/01-nginx-deployment.yaml
        kubectl apply -f kubernetes/02-prometheus.yaml
        kubectl apply -f kubernetes/03-grafana.yaml
        
        # Wait for deployments
        kubectl wait --for=condition=available --timeout=300s deployment/nginx -n devsecops
        kubectl wait --for=condition=available --timeout=300s deployment/prometheus -n monitoring
        kubectl wait --for=condition=available --timeout=300s deployment/grafana -n monitoring
        
        # Run tests
        kubectl run test --image=alpine/curl --restart=Never --rm -i -- curl -f http://nginx-service.devsecops.svc.cluster.local
        
        echo "✅ Deployment successful!"
    
    - name: Run Kubernetes tests
      run: |
        export KUBECONFIG=kubeconfig
        
        # Test deployments
        kubectl get deployments -A
        kubectl get pods -A
        
        # Check pod status
        kubectl get pods -n devsecops -o jsonpath='{.items[*].status.phase}' | grep -q Running
        
        echo "✅ All tests passed!"

  monitoring-tests:
    needs: kubernetes-deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Run monitoring tests
      run: |
        # Port forward to access services
        kubectl port-forward -n monitoring service/prometheus-service 9090:9090 &
        kubectl port-forward -n monitoring service/grafana-service 3000:3000 &
        
        sleep 10
        
        # Test Prometheus
        curl -f http://localhost:9090/api/v1/query?query=up
        
        # Test Grafana
        curl -f http://localhost:3000/api/health
        
        echo "✅ Monitoring services are healthy"
    
    - name: Generate deployment report
      run: |
        echo "# Deployment Report" > report.md
        echo "## Summary" >> report.md
        echo "- Application: Deployed successfully" >> report.md
        echo "- Security: No critical vulnerabilities" >> report.md
        echo "- Monitoring: Services running" >> report.md
        echo "" >> report.md
        echo "## Services" >> report.md
        echo "- Nginx: http://nginx-service.devsecops.svc.cluster.local" >> report.md
        echo "- Prometheus: http://prometheus-service.monitoring.svc.cluster.local:9090" >> report.md
        echo "- Grafana: http://grafana-service.monitoring.svc.cluster.local:3000" >> report.md
        
        cat report.md

  slack-notification:
    needs: [security-scan, kubernetes-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: job,commit,author,action,eventName,ref,workflow
        author_name: DevSecOps Pipeline
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
