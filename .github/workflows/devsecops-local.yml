name: DevSecOps Local Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run Trivy on Dockerfile
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
    
    - name: Dockerfile Lint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: ./applications/nginx/Dockerfile
    
    - name: Show scan summary
      run: |
        echo "Security scan completed!"
        echo "Vulnerabilities checked: Dockerfile and dependencies"

  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t devsecops-nginx:test ./applications/nginx
        echo "✅ Image built successfully"
    
    - name: Test Docker image
      run: |
        docker run --rm devsecops-nginx:test nginx -t
        echo "✅ Nginx configuration test passed"
    
    - name: Run container test
      run: |
        docker run -d --name test-nginx -p 8081:80 devsecops-nginx:test
        sleep 5
        curl -f http://localhost:8081 || exit 1
        docker stop test-nginx
        echo "✅ Container test passed"

  documentation-check:
    runs-on: ubuntu-latest
    steps:
    - name: Check documentation
      run: |
        echo "Checking required files..."
        [ -f README.md ] && echo "✅ README.md exists" || echo "❌ README.md missing"
        [ -f docker-compose.yaml ] && echo "✅ docker-compose.yaml exists" || echo "❌ docker-compose.yaml missing"
        [ -f applications/nginx/Dockerfile ] && echo "✅ Dockerfile exists" || echo "❌ Dockerfile missing"
        echo "Documentation check complete!"
