- rule: Write below root
  desc: Detect attempts to write to root directories
  condition: >
    evt.type in (open, openat, openat2, creat, write, rename, link, symlink,
                 unlink, rmdir, mkdir, mknod, truncate, ftruncate) and
    fd.name startswith "/" and
    not proc.name in (falco, systemd, sshd, cron, atd, auditd, rsyslogd)
  output: >
    File below root opened for writing (user=%user.name command=%proc.cmdline
    file=%fd.name)
  priority: WARNING
  tags: [filesystem]

- rule: Unexpected inbound connection
  desc: Inbound network connection from unexpected source
  condition: >
    evt.type=connect and evt.dir=< and
    not (fd.sip in (127.0.0.1, 172.17.0.1, 10.0.0.0/8, 192.168.0.0/16))
  output: >
    Unexpected inbound connection (user=%user.name command=%proc.cmdline
    connection=%fd.name)
  priority: NOTICE
  tags: [network]

- rule: Container running with privileged flag
  desc: Detect containers running with privileged flag
  condition: >
    container.id != host and
    container.privileged = true
  output: >
    Privileged container started (user=%user.name command=%proc.cmdline
    container=%container.name image=%container.image.repository:%container.image.tag)
  priority: ERROR
  tags: [container, privileged]

- rule: Shell spawned in container
  desc: A shell was spawned by a non-shell program in a container
  condition: >
    container.id != host and
    spawned_process and
    proc.name in (bash, sh, zsh, ksh, csh, tcsh, dash)
  output: >
    Shell spawned in container (user=%user.name container=%container.name
    shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, shell]

- rule: Sensitive mount in container
  desc: Container with sensitive host directory mounted
  condition: >
    container.id != host and
    (container.mount.source contains "/etc" or
     container.mount.source contains "/proc" or
     container.mount.source contains "/sys")
  output: >
    Sensitive mount in container (user=%user.name container=%container.name
    mount=%container.mount.source)
  priority: ERROR
  tags: [container, mount]
