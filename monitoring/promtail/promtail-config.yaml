server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. ZBIERANIE LOGÓW Z KONTENERÓW DOCKER (GŁÓWNY CEL!)
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Pobierz nazwę kontenera
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Pobierz obraz kontenera
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'
      
      # Dodaj job label
      - target_label: 'job'
        replacement: 'docker-logs'
      
      # Zbieraj tylko logi aplikacji (pomiń monitoring)
      - source_labels: ['__meta_docker_container_name']
        regex: '(promtail|loki|grafana|prometheus|trivy)'
        action: drop
    
  # 2. LOGI Z RAPORTÓW TRIVY
  - job_name: trivy-reports
    static_configs:
      - targets:
          - localhost
        labels:
          job: trivy-reports
          app: security-scanner
          __path__: /reports/*.txt
  
  # 3. LOGI SYSTEMOWE (opcjonalnie)
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system-logs
          host: docker-host
          __path__: /var/log/*.log
