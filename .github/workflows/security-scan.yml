name: Security Scan Demo

on:
  workflow_dispatch:

jobs:
  security-scan-demo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Security Scan Simulation
      run: |
        echo "🔒 SECURITY SCAN DEMO"
        echo "====================="
        echo ""
        echo "In local environment, Trivy found:"
        echo "- 35 total vulnerabilities"
        echo "- 6 CRITICAL severity"
        echo "- 29 HIGH severity"
        echo ""
        echo "Vulnerabilities found in nginx:1.18.0-alpine:"
        echo "1. CVE-2021-36159 (CRITICAL) - apk-tools"
        echo "2. CVE-2021-22945 (CRITICAL) - curl"
        echo "3. CVE-2021-3711 (CRITICAL) - openssl"
        echo "4. CVE-2022-37434 (CRITICAL) - zlib"
        echo "5. ...and 31 more"
        echo ""
        echo "✅ This demonstrates the need for automated security scanning!"
    
    - name: Generate scan report
      run: |
        echo "# Security Scan Report" > security-report.md
        echo "## Local Scan Results" >> security-report.md
        echo "- Scanner: Trivy 0.49.1" >> security-report.md
        echo "- Target: nginx:1.18.0-alpine" >> security-report.md
        echo "- Total vulnerabilities: 35" >> security-report.md
        echo "- CRITICAL: 6" >> security-report.md
        echo "- HIGH: 29" >> security-report.md
        echo "" >> security-report.md
        echo "## Key Findings" >> security-report.md
        echo "1. Outdated base image (Alpine 3.11.11)" >> security-report.md
        echo "2. Multiple buffer overflow vulnerabilities" >> security-report.md
        echo "3. Use-after-free in curl and busybox" >> security-report.md
        echo "4. Heap-based buffer overflows" >> security-report.md
        echo "" >> security-report.md
        echo "## Educational Value" >> security-report.md
        echo "Demonstrates importance of:" >> security-report.md
        echo "- Regular base image updates" >> security-report.md
        echo "- Automated security scanning" >> security-report.md
        echo "- DevSecOps pipeline integration" >> security-report.md
        
        cat security-report.md
