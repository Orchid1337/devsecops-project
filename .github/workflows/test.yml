name: DevSecOps Pipeline Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Test Docker build
      run: |
        echo "Testing if Dockerfile builds..."
        docker build -t test-image ./applications/nginx
        echo "✅ Docker build successful"
    
    - name: Check Docker Compose config
      run: |
        echo "Validating docker-compose.yaml..."
        docker-compose config
        echo "✅ Docker Compose config valid"
    
    - name: Basic security check
      run: |
        echo "This would run security scans in real pipeline"
        echo "For demo: Showing that pipeline would work"
        echo "✅ Security check placeholder"
    
    - name: Documentation check
      run: |
        echo "Required files:"
        [ -f README.md ] && echo "✅ README.md" || echo "❌ README.md missing"
        [ -f docker-compose.yaml ] && echo "✅ docker-compose.yaml" || echo "❌ docker-compose.yaml missing"
        [ -f applications/nginx/Dockerfile ] && echo "✅ Dockerfile" || echo "❌ Dockerfile missing"
        [ -f start.sh ] && echo "✅ start.sh" || echo "❌ start.sh missing"
