name: 🛡️ DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  walidacja:
    name: "📁 Walidacja projektu"
    runs-on: ubuntu-latest
    
    steps:
    - name: "⬇️ Pobierz kod"
      uses: actions/checkout@v4
    
    - name: "🔍 Sprawdź strukturę"
      run: |
        echo "=== STRUKTURA PROJEKTU ==="
        echo "Projekt DevSecOps - Praca Inżynierska"
        echo ""
        
        # Debug - pokaż gdzie jesteśmy
        echo "📂 Bieżący katalog: $(pwd)"
        echo ""
        
        # Flaga błędów
        HAS_ERRORS=0
        
        echo "📋 PLIKI KRYTYCZNE:"
        if [ -f "docker-compose.yaml" ]; then 
          echo "✅ docker-compose.yaml"
        else 
          echo "❌ BRAK: docker-compose.yaml"
          HAS_ERRORS=1
        fi
        
        if [ -f "README.md" ]; then 
          echo "✅ README.md"
        else 
          echo "❌ BRAK: README.md"
          HAS_ERRORS=1
        fi
        
        if [ -f "start.sh" ]; then 
          echo "✅ start.sh"
          # Sprawdź czy jest wykonywalny
          if [ ! -x "start.sh" ]; then
            echo "⚠️  Uwaga: start.sh nie jest wykonywalny (chmod +x start.sh)"
          fi
        else 
          echo "❌ BRAK: start.sh"
          HAS_ERRORS=1
        fi
        
        echo ""
        echo "📁 APLIKACJE (wymagane 5 WŁASNYCH):"
        APP_COUNT=0
        
        for app in nginx node-vuln-app python-vuln-app php-vuln-app vulnerable-db; do
          if [ -f "applications/$app/Dockerfile" ]; then 
            echo "✅ $app/Dockerfile"
            APP_COUNT=$((APP_COUNT + 1))
          else 
            echo "❌ BRAK: $app/Dockerfile"
          fi
        done
        
        if [ $APP_COUNT -lt 5 ]; then
          echo "⚠️  UWAGA: Tylko $APP_COUNT/5 własnych aplikacji (minimum 3 dla demonstracji)"
          if [ $APP_COUNT -lt 3 ]; then
            HAS_ERRORS=1
          fi
        fi
        
        echo ""
        echo "🎯 STRATEGIA TESTOWANIA:"
        echo "✅ 5 własnych aplikacji (budowane lokalnie z Dockerfile)"
        echo "✅ 1 gotowy obraz OWASP Juice Shop (z Docker Hub)"
        echo "📊 Razem: 6 obrazów do demonstracji skanera"
        
        # Sprawdź czy są pliki skanowania
        echo ""
        echo "🔍 NARZĘDZIA SKANOWANIA:"
        if [ -f "scan.sh" ]; then 
          echo "✅ scan.sh"
          if [ ! -x "scan.sh" ]; then
            echo "⚠️  Uwaga: scan.sh nie jest wykonywalny"
          fi
        else 
          echo "❌ BRAK: scan.sh"
          HAS_ERRORS=1
        fi
        
        if [ -f "scanners/trivy-metrics-exporter.py" ]; then 
          echo "✅ Trivy metrics exporter"
        else 
          echo "⚠️  Brak eksportera metryk (ważne dla dashboardu)"
        fi
        
        if [ $HAS_ERRORS -eq 1 ]; then
          echo ""
          echo "❌ BRAKUJE KRYTYCZNYCH PLIKÓW - PIPELINE FAILED"
          exit 1
        fi
        
        echo ""
        echo "🎉 Podstawowa struktura projektu jest POPRAWNA"
    
    - name: "🐳 Analiza Dockerfile'ów (hadolint) - RZECZYWISTA"
      run: |
        echo "=== ANALIZA DOCKERFILE'ÓW ==="
        
        # Pobierz hadolint
        curl -s -L -o /tmp/hadolint "https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64"
        chmod +x /tmp/hadolint
        
        echo "🔍 Sprawdzam Dockerfile'e (pokazuję rzeczywiste błędy):"
        echo ""
        
        DOCKER_ERRORS=0
        
        for app in nginx node-vuln-app python-vuln-app php-vuln-app vulnerable-db; do
          if [ -f "applications/$app/Dockerfile" ]; then
            echo "📄 $app/Dockerfile:"
            # URUCHOM Z RZECZYWISTYM OUTPUTEM, NIE UKRYWAJ!
            if /tmp/hadolint "applications/$app/Dockerfile"; then
              echo "   ✅ Poprawny"
            else
              echo "   ❌ ZNALEZIONO BŁĘDY"
              DOCKER_ERRORS=$((DOCKER_ERRORS + 1))
            fi
            echo ""
          fi
        done
        
        if [ $DOCKER_ERRORS -gt 0 ]; then
          echo "⚠️  UWAGA: Znaleziono błędy w $DOCKER_ERRORS Dockerfile'ach"
          echo "   (ale kontynuuję pipeline - w tym projekcie mogą być CELOWE podatności)"
        else
          echo "📊 Wszystkie Dockerfile'y przeszły analizę"
        fi
    
    - name: "🐚 Analiza skryptów (shellcheck) - RZECZYWISTA"
      run: |
        echo "=== ANALIZA SKRYPTÓW BASH ==="
        
        # Instaluj shellcheck
        echo "📦 Instalacja shellcheck..."
        sudo apt-get update -qq
        sudo apt-get install -y shellcheck -qq
        
        echo "🔍 Sprawdzam skrypty (pokazuję rzeczywiste ostrzeżenia):"
        echo ""
        
        SCRIPT_ERRORS=0
        
        # Funkcja do sprawdzania skryptów
        check_script() {
          local script="$1"
          if [ -f "$script" ]; then
            echo "📄 $script:"
            # POKAŻ OUTPUT
            if shellcheck "$script"; then
              echo "   ✅ Poprawny"
            else
              echo "   ⚠️  Znaleziono problemy"
              SCRIPT_ERRORS=$((SCRIPT_ERRORS + 1))
            fi
          else
            echo "📄 $script: ❌ Nie znaleziono"
            if [[ "$script" == "scan.sh" ]] || [[ "$script" == "start.sh" ]]; then
              SCRIPT_ERRORS=$((SCRIPT_ERRORS + 1))
            fi
          fi
          echo ""
        }
        
        # Sprawdź główne skrypty
        check_script "start.sh"
        check_script "scan.sh"
        check_script "clean-reports.sh"
        
        # Sprawdź dodatkowe skrypty
        if [ -f "scanners/trivy-scan.sh" ]; then
          check_script "scanners/trivy-scan.sh"
        fi
        
        if [ $SCRIPT_ERRORS -gt 0 ]; then
          echo "⚠️  UWAGA: Znaleziono problemy w $SCRIPT_ERRORS skryptach"
          echo "   Popraw ostrzeżenia shellcheck przed wysłaniem pracy"
        else
          echo "📊 Wszystkie skrypty są poprawne"
        fi
    
    - name: "🔧 Walidacja docker-compose"
      run: |
        echo "=== WALIDACJA DOCKER-COMPOSE ==="
        
        if [ -f "docker-compose.yaml" ]; then
          echo "🔍 Sprawdzam składnię docker-compose..."
          
          # Instaluj docker-compose jeśli nie ma
          if ! command -v docker-compose &> /dev/null; then
            echo "📦 Instaluję docker-compose..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # Waliduj
          if docker-compose -f docker-compose.yaml config > /dev/null 2>&1; then
            echo "✅ docker-compose.yaml ma poprawną składnię"
            
            # Pokaż liczbę usług
            SERVICES=$(docker-compose -f docker-compose.yaml config --services | wc -l)
            echo "📊 Liczba zdefiniowanych usług: $SERVICES"
            
            # Sprawdź czy jest Juice Shop
            if docker-compose -f docker-compose.yaml config --services | grep -q "juice-shop"; then
              echo "✅ OWASP Juice Shop jest w docker-compose"
            else
              echo "⚠️  UWAGA: Brak Juice Shop w docker-compose (ale może być skanowany przez scan.sh)"
            fi
            
          else
            echo "❌ docker-compose.yaml ma błędy składniowe"
            echo "🔍 Szczegóły błędów:"
            docker-compose -f docker-compose.yaml config
            exit 1
          fi
        else
          echo "❌ Brak pliku docker-compose.yaml"
          exit 1
        fi

  raportowanie:
    name: "📋 Generuj podsumowanie"
    runs-on: ubuntu-latest
    needs: walidacja
    
    steps:
    - name: "⬇️ Pobierz kod"
      uses: actions/checkout@v4
    
    - name: "📊 Utwórz raport z rzeczywistymi wynikami"
      run: |
        echo "# 📋 Raport Walidacji DevSecOps" > raport.md
        echo "" >> raport.md
        echo "## 📅 Data wykonania: $(date)" >> raport.md
        echo "" >> raport.md
        
        # Zbierz statystyki
        DOCKERFILE_COUNT=0
        if [ -d "applications" ]; then
          DOCKERFILE_COUNT=$(find applications -name "Dockerfile" -type f | wc -l)
        fi
        
        SCRIPT_COUNT=$(find . -maxdepth 2 -name "*.sh" -type f | wc -l)
        PYTHON_COUNT=$(find . -maxdepth 2 -name "*.py" -type f | wc -l)
        YAML_COUNT=$(find monitoring -name "*.yaml" -o -name "*.yml" -type f 2>/dev/null | wc -l)
        
        echo "### 📊 Statystyki projektu:" >> raport.md
        echo "" >> raport.md
        echo "- **🐳 Własnych Dockerfile'ów**: $DOCKERFILE_COUNT/5" >> raport.md
        echo "- **🐚 Skryptów bash**: $SCRIPT_COUNT" >> raport.md
        echo "- **🐍 Skryptów Python**: $PYTHON_COUNT" >> raport.md
        echo "- **📁 Plików konfiguracyjnych (monitoring)**: $YAML_COUNT" >> raport.md
        echo "" >> raport.md
        
        echo "### 🎯 Strategia testowania bezpieczeństwa:" >> raport.md
        echo "" >> raport.md
        echo "Projekt używa **dwóch komplementarnych podejść** do demonstracji skanera Trivy:" >> raport.md
        echo "" >> raport.md
        echo "#### 1. 🏗️ **5 własnych aplikacji** (budowane lokalnie z Dockerfile):" >> raport.md
        echo "" >> raport.md
        if [ $DOCKERFILE_COUNT -gt 0 ]; then
          find applications -name "Dockerfile" -type f | sed 's|applications/||; s|/Dockerfile||' | while read app; do
            echo "   - **$app** - celowo podatna aplikacja" >> raport.md
          done
        else
          echo "   - ❌ Brak własnych aplikacji" >> raport.md
        fi
        echo "" >> raport.md
        echo "   **Cel**: Pokazać jak skanować **własny kod** w procesie CI/CD" >> raport.md
        echo "   **Metoda**: Dockerfile'e celowo zawierają 'złe praktyki' bezpieczeństwa" >> raport.md
        echo "" >> raport.md
        echo "#### 2. 📦 **1 gotowy obraz OWASP** (pobierany z Docker Hub):" >> raport.md
        echo "" >> raport.md
        echo "   - **OWASP Juice Shop** (bkimminich/juice-shop:latest)" >> raport.md
        echo "" >> raport.md
        echo "   **Cel**: Pokazać jak skanować **zewnętrzne, gotowe obrazy**" >> raport.md
        echo "   **Metoda**: Standardowa aplikacja testowa zawierająca 100+ celowych podatności" >> raport.md
        echo "   **Znaczenie**: Juice Shop to industry standard w edukacji bezpieczeństwa aplikacji webowych" >> raport.md
        echo "" >> raport.md
        echo "#### 📈 **RAZEM: 6 obrazów** do kompleksowej demonstracji DevSecOps" >> raport.md
        echo "" >> raport.md
        
        # Lista znalezionych plików
        echo "### 📁 Znalezione pliki:" >> raport.md
        echo "" >> raport.md
        
        if [ $DOCKERFILE_COUNT -gt 0 ]; then
          echo "**Dockerfile'e:**" >> raport.md
          find applications -name "Dockerfile" -type f | sed 's|^|  - |' >> raport.md
          echo "" >> raport.md
        fi
        
        if [ $SCRIPT_COUNT -gt 0 ]; then
          echo "**Skrypty bash:**" >> raport.md
          find . -maxdepth 2 -name "*.sh" -type f | sed 's|^|  - |' >> raport.md
          echo "" >> raport.md
        fi
        
        echo "### ✅ Przeprowadzone testy walidacyjne:" >> raport.md
        echo "" >> raport.md
        echo "1. **Walidacja struktury** - sprawdzenie kompletności projektu" >> raport.md
        echo "2. **Analiza Dockerfile'ów z Hadolint** - rzeczywiste sprawdzenie zgodności z best practices" >> raport.md  
        echo "3. **Analiza skryptów bash z ShellCheck** - rzeczywista walidacja składni i bezpieczeństwa" >> raport.md
        echo "4. **Walidacja docker-compose** - sprawdzenie poprawności konfiguracji orchestracji" >> raport.md
        echo "" >> raport.md
        
        echo "### 🎓 Wnioski dla pracy inżynierskiej:" >> raport.md
        echo "" >> raport.md
        echo "- ✅ **Kompleksowa architektura** - pełny stack DevSecOps" >> raport.md
        echo "- ✅ **Realistyczne testowanie** - mix własnych i zewnętrznych aplikacji" >> raport.md
        echo "- ✅ **Automatyzacja CI/CD** - pipeline GitHub Actions z rzeczywistą walidacją" >> raport.md
        echo "- ✅ **Monitoring w czasie rzeczywistym** - Grafana dashboard z metrykami bezpieczeństwa" >> raport.md
        echo "- ✅ **Industry standards** - użycie OWASP Juice Shop jako benchmark" >> raport.md
        echo "" >> raport.md
        
        # Sprawdź czy start.sh i scan.sh istnieją
        if [ -f "start.sh" ]; then
          START_CMD="./start.sh"
        else
          START_CMD="bash start.sh"
        fi
        
        if [ -f "scan.sh" ]; then
          SCAN_CMD="./scan.sh"
        else
          SCAN_CMD="bash scan.sh"
        fi
        
        echo "### 🚀 Instrukcja uruchomienia:" >> raport.md
        echo "" >> raport.md
        echo "```bash" >> raport.md
        echo "# 1. Uruchom całe środowisko DevSecOps" >> raport.md
        echo "$START_CMD" >> raport.md
        echo "" >> raport.md
        echo "# 2. Wykonaj skan bezpieczeństwa 6 obrazów" >> raport.md
        echo "$SCAN_CMD" >> raport.md
        echo "```" >> raport.md
        echo "" >> raport.md
        echo "#### 🌐 Dostępne interfejsy:" >> raport.md
        echo "" >> raport.md
        echo "- **Dashboard bezpieczeństwa**: http://localhost:3002 (admin/admin)" >> raport.md
        echo "- **Metryki Prometheus**: http://localhost:8083/metrics" >> raport.md
        echo "- **Aplikacja testowa**: http://localhost:3001 (OWASP Juice Shop)" >> raport.md
        echo "- **Podatne aplikacje**: localhost:8080, :3003, :5000, :8081, :5432" >> raport.md
        echo "" >> raport.md
        
        echo "---" >> raport.md
        echo "**Wygenerowano automatycznie przez GitHub Actions**" >> raport.md
        echo "**Repozytorium**: https://github.com/Orchid1337/devsecops-project" >> raport.md
        echo "**Data wykonania**: $(date)" >> raport.md
        
        echo "✅ Raport utworzony: raport.md"
    
    - name: "📤 Prześlij artefakty"
      uses: actions/upload-artifact@v4
      with:
        name: raport-walidacji-devsecops
        path: raport.md
    
    - name: "🎉 Finalne podsumowanie"
      run: |
        echo ""
        echo "=================================================="
        echo "           🎓 DEVSECOPS - PRACA INŻYNIERSKA"
        echo "=================================================="
        echo ""
        echo "✅ WALIDACJA ZAKOŃCZONA SUKCESEM"
        echo ""
        
        # Oblicz statystyki
        DOCKERFILE_COUNT=0
        if [ -d "applications" ]; then
          DOCKERFILE_COUNT=$(find applications -name "Dockerfile" -type f | wc -l)
        fi
        
        SCRIPT_COUNT=$(find . -maxdepth 2 -name "*.sh" -type f | wc -l)
        
        echo "📊 STRUKTURA PROJEKTU:"
        echo "  🏗️  Własnych aplikacji: $DOCKERFILE_COUNT/5"
        echo "  📦 Obrazów zewnętrznych: 1 (OWASP Juice Shop)"
        echo "  🐚 Skryptów automatyzacji: $SCRIPT_COUNT"
        echo "  📈 Razem obrazów do skanowania: $((DOCKERFILE_COUNT + 1))"
        echo ""
        
        echo "🔍 PRZEPROWADZONE TESTY:"
        echo "  1. ✅ Walidacja struktury projektu"
        echo "  2. ✅ RZECZYWISTA analiza Dockerfile'ów (Hadolint)"  
        echo "  3. ✅ RZECZYWISTA analiza skryptów (ShellCheck)"
        echo "  4. ✅ Walidacja docker-compose.yml"
        echo ""
        
        echo "🎯 KLUCZOWE ELEMENTY DEMONSTRACJI:"
        echo "  • Skanowanie WŁASNYCH aplikacji (Dockerfile'e z celowymi podatnościami)"
        echo "  • Skanowanie ZEWNĘTRZNYCH obrazów (OWASP Juice Shop - industry standard)"
        echo "  • Dashboard bezpieczeństwa w czasie rzeczywistym (Grafana)"
        echo "  • Automatyczny pipeline CI/CD (GitHub Actions)"
        echo ""
        
        echo "📎 Pobierz szczegółowy raport z zakładki 'Artifacts'"
        echo "🔗 https://github.com/Orchid1337/devsecops-project/actions"
        echo ""
        echo "🚀 MATERIAŁY DOWODOWE DLA PRACY:"
        echo "- ✅ Potwierdzenie działania CI/CD pipeline"
        echo "- ✅ Rzeczywiste wyniki walidacji kodu"
        echo "- ✅ Dokumentacja strategii testowania"
        echo "- ✅ Gotowy raport wykonania z metrykami"
        echo ""
        echo "=================================================="
